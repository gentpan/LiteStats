name: litestats
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litestats
      POSTGRES_DB: litestats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the installer first}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U litestats -d litestats']
      interval: 5s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: litestats
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run the installer first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    image: ${LITESTATS_IMAGE:-litestats:local}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      SEED_DEMO: 'false'
    ports:
      - '127.0.0.1:${APP_PORT:-3100}:3100'
    volumes:
      - ./ops-run:/run/litestats-ops:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 30s
  ops:
    profiles: [ops]
    image: litestats-ops:local
    build:
      context: .
      dockerfile: Ops.Dockerfile
    env_file: .env
    entrypoint: [python3, /ops/litestats.py]
    user: "${OPS_UID:-0}:${OPS_GID:-0}"
    volumes:
      - ./:/instance
volumes:
  pg:
  ch:
